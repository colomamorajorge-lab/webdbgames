<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Games Studios Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            text-align: center;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #0a0a0a;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(10, 10, 10, 0.7);
            z-index: -1;
        }

        .main-container {
            background-color: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            padding: 35px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 1000px;
            width: 100%;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            gap: 20px;
        }

        .logo-img {
            width: 75px;
            height: 75px;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .main-title, .sub-title {
            font-size: 32px;
            font-weight: 700;
            color: #00ffcc;
            line-height: 1.1;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .subtitle {
            font-size: 15px;
            color: #bbbbbb;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-roblox {
            background-color: #0066cc;
            color: white;
            box-shadow: 0 0 15px rgba(0, 102, 204, 0.5);
        }
        .btn-roblox:hover { background-color: #0077ff; }

        .btn-web {
            background-color: #00cc88;
            color: white;
            box-shadow: 0 0 15px rgba(0, 204, 136, 0.5);
        }
        .btn-web:hover { background-color: #00e699; }

        .btn-soon {
            background-color: #2a2a2a;
            color: #bbbbbb;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2a2a2a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .social-icon:hover { transform: translateY(-2px); background-color: #3a3a3a; }
        .social-icon.discord { background-color: #5865F2; border: none; }
        .social-icon.x { background-color: #000000; border: 1px solid rgba(255,255,255,0.2); }

        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            margin-bottom: 5px;
        }

        .stat-text { font-size: 13px; color: #aaaaaa; }
    </style>
</head>
<body>

    <!-- VÍDEO DE FONDO (FUERA DE LAS ETIQUETAS DE ESTILO) -->
    <video autoplay muted loop playsinline preload="auto" class="video-background">
        <source src="Tráiler Reveal! Grow a Garden 2🥕.mp4" type="video/mp4">
        Tu navegador no soporta vídeos de fondo.
    </video>

    <!-- CAPA OSCURA -->
    <div class="video-overlay"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container">
        <div id="homeSection">
            <div class="header">
                <img src="https://files.catbox.moe/0s2m49.png" alt="Logo" class="logo-img">
                <div class="title-container">
                    <span class="main-title">DB Games</span>
                    <span class="sub-title">Studios</span>
                </div>
            </div>
            
            <p class="subtitle">Welcome to the official video game development hub.</p>

            <div class="button-group">
                <a href="https://dobig.com/games" target="_blank" class="btn btn-roblox"><span>🎮 View all games (Roblox)</span></a>
                <a href="https://dobig.com" target="_blank" class="btn btn-web"><span>🕹️ Play games (Web)</span></a>
                <a href="#" class="btn btn-soon"><span>⏳ Coming Soon</span></a>
            </div>

            <div class="social-group">
                <a href="https://discord.com" target="_blank" class="social-icon discord" title="Discord">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                </a>
                <a href="https://twitter.com" target="_blank" class="social-icon x" title="X (Twitter)">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
            </div>

            <div class="divider"></div>

            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-number">1.2M+</span>
                    <span class="stat-text">Players enjoying our games</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number">50K+</span>
                    <span class="stat-text">Total members in community</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
